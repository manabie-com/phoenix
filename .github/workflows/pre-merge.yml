name: Pre-merge

# Pre-merge gate for the manabie-com fork.
#
# Nothing here runs until a maintainer adds the "Ok to test" label to the PR.
# The final `Pre-merge` job is the single required status check on `main`:
# it fails while the label is missing, and fails if any gated job failed.
#
# This file is fork-local and has no upstream counterpart, so it should not
# conflict when syncing with Arize-ai/phoenix.
#
# Upstream's own pull_request workflows are disabled on this fork, because many of
# their jobs require the `oss-4-core-runner` self-hosted label (queues forever, no
# runner) or secrets the fork does not hold (queues, or fails). Their coverage is
# reproduced here on `ubuntu-latest` instead. Consciously NOT reproduced, because
# each protects upstream's release surface rather than this fork's code:
#
#   - Check Card Links ............ upstream docs-site link hygiene; posts PR comments
#   - Clean Jupyter Notebooks ..... upstream notebook metadata hygiene
#   - Client Canary Tests (SDKs) .. tracks upstream's weekly third-party dep upgrades
#   - JSON Canonicalization Schema  upstream's cross-language schema pin
#   - PXI Regression Evals ........ needs OPENAI/PHOENIX_API_KEY secrets
#   - claude-code-review .......... needs ANTHROPIC_API_KEY
#   - CLA Assistant ............... gates contributions to Arize-ai, not to this fork
#   - Publish Any Pull Request .... would publish npm previews from the fork
#   - Semantic PR ................. conventional-commit PR titles (disabled by choice)
#
# If any of those becomes relevant, add the job here rather than re-enabling the
# upstream workflow: re-enabling brings back the runner and secret problems.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.12"
  # fake openai key so that llama_index doesn't download huggingface embeddings
  OPENAI_API_KEY: "sk-fake-openai-key"

jobs:
  changes:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.label.outputs.approved }}
      python: ${{ steps.filter.outputs.python }}
      app: ${{ steps.filter.outputs.app }}
      packages: ${{ steps.filter.outputs.packages }}
      py_packages: ${{ steps.filter.outputs.py_packages }}
      migrations: ${{ steps.filter.outputs.migrations }}
      e2e: ${{ steps.filter.outputs.e2e }}
      helm: ${{ steps.filter.outputs.helm }}
      openapi: ${{ steps.filter.outputs.openapi }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check for the "Ok to test" label
        id: label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if jq -e 'index("Ok to test")' <<< "$LABELS" > /dev/null; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "::notice::\"Ok to test\" label present - running pre-merge checks."
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "::warning::\"Ok to test\" label missing - pre-merge checks will not run."
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.label.outputs.approved == 'true'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        if: steps.label.outputs.approved == 'true'
        id: filter
        with:
          filters: |
            python:
              - "src/**"
              - "tests/**"
              - "evals/**"
              - "packages/**"
              - "pyproject.toml"
              - "tox.ini"
              - "uv.lock"
            app:
              - "app/**"
              - "schemas/openapi.json"
              - "src/phoenix/server/generative_ui/**"
              - ".oxlintrc.json"
              - ".oxfmtrc.jsonc"
              - ".nvmrc"
            packages:
              - "js/**"
              - "schemas/**"
              - ".oxlintrc.json"
              - ".oxfmtrc.jsonc"
              - ".nvmrc"
            py_packages:
              - "packages/**"
              - "uv.lock"
            migrations:
              - "src/phoenix/db/migrations/**"
              - "src/phoenix/db/models.py"
            e2e:
              - "app/**"
              - "src/phoenix/**"
              - "pyproject.toml"
              - "uv.lock"
            helm:
              - "helm/**"
            openapi:
              - "schemas/openapi.json"
            workflows:
              - ".github/workflows/**"

  python-lint:
    name: Python Format & Lint
    runs-on: ubuntu-latest
    needs: changes
    # Deliberately NOT path-filtered. `ruff format` / `ruff check --fix` run
    # repo-wide, so this is the one job that catches drift anywhere in the tree
    # - including drift a PR did not introduce. Without it, a PR touching only
    # workflows or docs would get a green `Pre-merge` having checked nothing.
    if: ${{ needs.changes.outputs.approved == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run formatter and linter
        run: |
          make format-python
          make lint-python
      - name: Fail if formatting or lint autofixes changed files
        run: git diff --exit-code

  python-typecheck:
    name: Python Type Check (${{ matrix.py }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.python == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Type check all Python code
        run: uv run mypy
      - name: Ensure GraphQL mutations have permission classes
        run: make check-graphql-permissions

  python-schemas:
    name: Python Schema & Codegen Drift
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.python == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Build GraphQL schema
        run: make schema-graphql
      - name: Build OpenAPI schema
        run: make schema-openapi
      - name: Compile prompts
        run: make codegen-prompts
      - name: Fail if any generated artifact is stale
        run: git diff --exit-code

  python-unit-tests:
    name: Python Unit Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.python == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      # Upstream's python-CI runs the PostgreSQL leg too, but its job requires the
      # `oss-4-core-runner` self-hosted label, which this fork has no runner for, so
      # it queues forever and never reports. Mirrored here on ubuntu-latest so the
      # fork's own gate covers both dialects. The floor version comes from PGDG
      # rather than whatever Ubuntu ships, matching upstream: the DSL suites assert
      # cross-dialect guarantees that must hold on the oldest supported PostgreSQL.
      - name: Install PostgreSQL (product floor)
        if: matrix.db == 'postgresql'
        run: |
          sudo apt-get -yqq install postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get -yqq install postgresql-14
      - name: Run unit tests (SQLite)
        if: matrix.db == 'sqlite'
        timeout-minutes: 45
        run: uvx tox run -e unit_tests -- -ra --reruns 5 -n auto --dist loadscope
      - name: Run unit tests (PostgreSQL)
        if: matrix.db == 'postgresql'
        timeout-minutes: 45
        run: >-
          uvx tox run -e unit_tests --
          -ra --reruns 5 --db postgresql -n auto --dist loadscope
          --postgresql-exec /usr/lib/postgresql/14/bin/pg_ctl

  typescript-app:
    name: Frontend Lint, Type Check & Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.app == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: app/package.json
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache-dependency-path: ./app/pnpm-lock.yaml
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile
      - name: Type Check
        working-directory: ./app
        run: pnpm run typecheck
      - name: Formatting
        working-directory: ./app
        run: pnpm run fmt:check
      - name: Lint
        working-directory: ./app
        run: pnpm run lint
      - name: Relay Codegen
        working-directory: ./app
        run: |
          pnpm run build:relay
          git diff --exit-code
      - name: OpenAPI Codegen
        working-directory: ./app
        run: |
          pnpm run generate:openapi
          git diff --exit-code
      - name: Generative UI Schema Codegen
        run: |
          make schema-generative-ui
          git diff --exit-code
      - name: Test
        working-directory: ./app
        run: pnpm run test

  typescript-packages:
    name: JS Packages Lint, Type Check & Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.packages == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json
      - name: Set up Nodejs
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache-dependency-path: ./js/pnpm-lock.yaml
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install Dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile -r
      - name: Build
        working-directory: ./js
        run: pnpm run -r build
      - name: Formatting
        working-directory: ./js
        run: pnpm run fmt:check
      - name: Type Checking
        working-directory: ./js
        run: pnpm run typecheck
      - name: Linting
        working-directory: ./js
        run: pnpm run lint
      - name: Test
        working-directory: ./js
        run: pnpm run -r test

  python-doctests:
    name: Python Doctests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.python == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run doctests
        run: make doctest

  python-integration-tests:
    name: Python Integration Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.python == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    env:
      CI_TEST_DB_BACKEND: ${{ matrix.db }}
    services:
      postgres:
        # Empty image on the sqlite leg: https://github.com/actions/runner/issues/822
        image: ${{ (matrix.db == 'postgresql') && 'postgres:14' || '' }}
        env:
          POSTGRES_PASSWORD: phoenix
        options: >-
          --name postgres
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Increase PostgreSQL max_connections
        if: matrix.db == 'postgresql'
        run: |
          docker exec postgres sed -i 's/^max_connections = .*/max_connections = 300/' /var/lib/postgresql/data/postgresql.conf
          docker restart postgres
          until docker exec postgres pg_isready -U postgres; do sleep 1; done
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      # `-n auto` rather than upstream's `-n 16`: this runs on a 4-core
      # GitHub-hosted runner, not upstream's `oss-4-core-runner` pool.
      - name: Run integration tests
        timeout-minutes: 45
        run: uvx tox run -e integration_tests -- -ra --reruns 5 -n auto

  python-migrations:
    name: DB Migration Continuity (${{ matrix.db }}${{ matrix.concurrently && ', concurrently' || '' }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.migrations == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
        concurrently: [false]
        include:
          - db: postgresql
            concurrently: true
    services:
      postgres:
        image: ${{ (matrix.db == 'postgresql') && 'postgres:14' || '' }}
        env:
          POSTGRES_PASSWORD: phoenix
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.14
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install released arize-phoenix and database dependencies
        run: |
          uv pip install --system -qU 'arize-phoenix[pg]'
          PHOENIX_PATH=$(python -c "import phoenix.db; print(phoenix.db.__path__[0])")
          echo "PHOENIX_PATH=$PHOENIX_PATH" >> "$GITHUB_ENV"
      - name: Set database environment variable
        run: |
          if [ "${{ matrix.db }}" = "postgresql" ]; then
            echo "PHOENIX_SQL_DATABASE_URL=postgresql://postgres:phoenix@localhost:5432/postgres" >> "$GITHUB_ENV"
          else
            echo "PHOENIX_SQL_DATABASE_URL=sqlite:///phoenix_test.db" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.concurrently }}" = "true" ]; then
            echo "PHOENIX_MIGRATE_INDEX_CONCURRENTLY=true" >> "$GITHUB_ENV"
          fi
      - name: Run migrations on the released Phoenix
        working-directory: ${{ env.PHOENIX_PATH }}
        run: |
          alembic history
          alembic upgrade head
          alembic current
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: src/phoenix/
      - name: Install Phoenix from the current branch
        run: uv pip install --system --reinstall-package arize-phoenix --no-sources .
      # The fork adds its own migration (media_files), so an upgrade path that
      # works from a released database matters more here than upstream, not less.
      - name: Test new migrations
        working-directory: ${{ env.PHOENIX_PATH }}
        run: |
          alembic history
          alembic upgrade head
          alembic current
      - name: Test down migrations
        working-directory: ${{ env.PHOENIX_PATH }}
        run: |
          alembic downgrade base
          alembic current
      - name: Test up migrations
        working-directory: ${{ env.PHOENIX_PATH }}
        run: |
          alembic upgrade head
          alembic current

  python-packages:
    name: Python Package (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.py_packages == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        pkg: [phoenix_client, phoenix_evals, phoenix_otel]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run package test suite
        run: uvx tox run -e ${{ matrix.pkg }} -- -ra -x

  helm-tests:
    name: Helm Chart Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.helm == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "latest"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Run Helm chart tests
        run: make test-helm

  actions-security:
    name: Actions Security (zizmor)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.workflows == 'true' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3

  package-versions:
    name: Package Version Consistency
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.packages == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # app/ and js/ must agree on the toolchain, or `pnpm lint` / `fmt:check`
      # disagree between the two workspaces and CI contradicts local runs.
      - name: Check pinned tool versions match between app/ and js/
        run: |
          fail=0
          check() {
            local label="$1" query="$2"
            local a b
            a=$(jq -r "$query // empty" app/package.json)
            b=$(jq -r "$query // empty" js/package.json)
            if [ -z "$a" ] || [ -z "$b" ]; then
              echo "::error::$label missing from app/package.json or js/package.json"
              fail=1
            elif [ "$a" != "$b" ]; then
              echo "::error::$label mismatch: app=$a js=$b"
              fail=1
            else
              echo "$label consistent: $a"
            fi
          }
          check "pnpm"             '.packageManager'
          check "oxlint"           '.devDependencies.oxlint'
          check "oxlint-tsgolint"  '.devDependencies["oxlint-tsgolint"]'
          check "oxfmt"            '.devDependencies.oxfmt'
          check "typescript"       '.devDependencies.typescript'
          exit $fail

  openapi-compat:
    name: OpenAPI Backward Compatibility
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.openapi == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot head schema
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          jq '.paths |= with_entries(select(.key | startswith("/agent") | not))' \
            schemas/openapi.json > head.json
          git checkout "origin/$BASE_REF"
      - name: Snapshot base schema
        run: |
          jq '.paths |= with_entries(select(.key | startswith("/agent") | not))' \
            schemas/openapi.json > base.json
      - uses: docker://openapitools/openapi-diff@sha256:82291446e5554742d9c0725d7b315d18e93958c5526f9a663e8885227bdd6cb6
        with:
          args: --fail-on-incompatible base.json head.json

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.approved == 'true' && needs.changes.outputs.e2e == 'true' }}
    defaults:
      run:
        working-directory: ./app
    env:
      # WebKit's deps can't be cached and Firefox is not exercised by the suite.
      CI_PLAYWRIGHT_SKIP_WEBKIT: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: app/package.json
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache-dependency-path: ./app/pnpm-lock.yaml
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Get installed Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm list --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_ENV"
      - name: Cache Playwright binaries
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('app/playwright.config.ts') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Sync Python dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --extra container
      # Sandbox providers the suite needs. The Phoenix container image bundles
      # these; a bare runner does not, so pin the same versions and surface them
      # through the same env-var contract ensure_wasm_binary() / DenoAdapter use.
      - name: Install Deno (TypeScript sandbox provider)
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.1.4
      - name: Pre-download CPython WASM binary
        working-directory: ${{ github.workspace }}
        # URL/filename/sha256 MUST stay in sync with
        # src/phoenix/server/sandbox/_download.py.
        run: |
          mkdir -p .cache/wasm
          python -c "import hashlib, sys, urllib.request; \
          url = 'https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python%2F3.12.0%2B20231211-040d5a6/python-3.12.0.wasm'; \
          dest = '.cache/wasm/python-3.12.0.wasm'; \
          expected = 'e5dc5a398b07b54ea8fdb503bf68fb583d533f10ec3f930963e02b9505f7a763'; \
          urllib.request.urlretrieve(url, dest); \
          actual = hashlib.sha256(open(dest, 'rb').read()).hexdigest(); \
          (actual == expected) or sys.exit(f'SHA-256 mismatch for {dest}: expected {expected}, got {actual}')"
          echo "PHOENIX_WASM_BINARY_PATH=${{ github.workspace }}/.cache/wasm/python-3.12.0.wasm" >> "$GITHUB_ENV"
      - name: Run Playwright tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30

  pre-merge:
    name: Pre-merge
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - python-lint
      - python-typecheck
      - python-schemas
      - python-unit-tests
      - python-doctests
      - python-integration-tests
      - python-migrations
      - python-packages
      - typescript-app
      - typescript-packages
      - helm-tests
      - actions-security
      - package-versions
      - openapi-compat
      - e2e-tests
    steps:
      - name: Require the "Ok to test" label
        if: ${{ needs.changes.outputs.approved != 'true' }}
        run: |
          echo "::error::Pre-merge checks have not run. A maintainer must add the \"Ok to test\" label to this pull request."
          exit 1
      - name: Check all gated jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more pre-merge jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more pre-merge jobs were cancelled"
            exit 1
          fi
          echo "All pre-merge jobs passed or were skipped"
