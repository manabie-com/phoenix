name: Post-merge

# Post-merge suites for the manabie-com fork.
#
# These run after a merge to `main`, not as part of the `Pre-merge` gate. They are
# here because their cost outweighs their value as a merge blocker on this fork's
# hardware -- the PostgreSQL unit leg exceeded 90 minutes and the Playwright suite
# exceeded 60 on a standard hosted runner, while the same code paths are already
# covered pre-merge by the SQLite-equivalent assertions, the integration suites on
# both dialects, and DB Migration Continuity.
#
# The trade is explicit: a regression only these suites can catch reaches `main`
# and is found afterwards, rather than being blocked. Watch this workflow -- a red
# run here means `main` is broken, and nothing will tell you except this page.
#
# Fork-local file with no upstream counterpart, so it will not conflict on sync.

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel: every commit that lands on `main` should be validated, and these
  # suites are the only place some of that coverage exists.
  group: post-merge-${{ github.sha }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.1"

jobs:
  python-unit-tests:
    name: Python Unit Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    env:
      # Fake key so that llama_index doesn't download huggingface embeddings.
      #
      # Scoped to this job on purpose. At workflow level the Playwright job
      # inherited it too, and a key -- even a fake one -- makes the server report
      # OpenAI as provisioned. The playground model picker then switches from
      # "show the flagship providers" to "show only ready providers"
      # (useModelMenuData.ts, visibleProviders), which drops Anthropic and Google
      # from the menu entirely and hung two specs on a locator that could never
      # resolve. Upstream's playwright.yaml sets no API keys at all, which is why
      # the same specs pass there. Reproduced locally both ways before moving it.
      OPENAI_API_KEY: "sk-fake-openai-key"
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Set up `uv`
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      # Upstream's python-CI runs this on its `oss-4-core-runner` self-hosted pool,
      # which this fork has no runner for, so upstream's job queues forever. The
      # floor version comes from PGDG rather than whatever Ubuntu ships, matching
      # upstream: the DSL suites assert cross-dialect guarantees that must hold on
      # the oldest supported PostgreSQL.
      - name: Install PostgreSQL (product floor)
        if: matrix.db == 'postgresql'
        run: |
          sudo apt-get -yqq install postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get -yqq install postgresql-14
      # Upstream's `-n 16` does not transfer to a standard hosted runner. Measured
      # on this fork:
      #   -n auto (4): SQLite passed in 28m; PostgreSQL exceeded a 45m timeout
      #   -n 16:       SQLite runner killed at 29m (SIGTERM, no speed gain at all)
      # So the suite is not starved of workers here -- it is memory-bound, and
      # oversubscribing only gets the runner VM reclaimed. Keep `-n auto` and buy
      # time with the timeout instead. Raise workers only with evidence.
      #
      # The PostgreSQL leg is NOT merely slow, and raising its timeout alone will
      # not make it pass. All 13 runs of this workflow are red; of the 5 opened,
      # PostgreSQL failed and SQLite passed every time, always the same way:
      # steady progress, then total silence until the step is killed. Measured on
      # run 31469235339 -- no gap between progress lines exceeded 100s all the way
      # to 99% at +53min, then 36 minutes of nothing. `-n auto` resolves to 2
      # workers here, not the 4 assumed above.
      #
      # The stall point is random across runs (32%, 40%, 73%, 99%) because
      # pytest-randomly reshuffles order each time, so it is one specific test
      # hanging rather than the suite being too slow. SQLite passes every run.
      # The `--timeout` below exists to name that test; until a run carries its
      # failure, the culprit is unidentified.
      - name: Run unit tests (SQLite)
        if: matrix.db == 'sqlite'
        timeout-minutes: 120
        run: uvx tox run -e unit_tests -- -ra --reruns 5 -n auto --dist loadscope
      # A hung test has to be turned into a named failure, or the leg just burns
      # its timeout and reports nothing (see the note above). pytest-timeout does
      # that; core pytest's `faulthandler_timeout` does not, because under xdist
      # the worker's dump never reaches the job log -- verified, it produces no
      # output at all with `-n 2`.
      #
      # It is not in upstream's requirements files, and putting it there would
      # add fork lines to an upstream-owned file for no reason. So build the env
      # first and install into it: tox reuses the env on the next `run`, and the
      # `uv pip install --strict` in its commands_pre only validates consistency,
      # it does not prune extras.
      - name: Build unit-test environment
        if: matrix.db == 'postgresql'
        run: uvx tox run -e unit_tests --notest
      - name: Add pytest-timeout to the unit-test environment
        if: matrix.db == 'postgresql'
        run: uv pip install --python .tox/unit_tests/bin/python pytest-timeout
      # 600s is far above any legitimate test here -- the suite's progress is
      # smooth, with no gap between progress lines over 100s -- so this fires
      # only on a genuine hang, and the run continues past it instead of dying.
      - name: Run unit tests (PostgreSQL)
        if: matrix.db == 'postgresql'
        timeout-minutes: 120
        run: >-
          uvx tox run -e unit_tests --
          -ra --reruns 5 --db postgresql -n auto --dist loadscope
          --timeout=600
          --postgresql-exec /usr/lib/postgresql/14/bin/pg_ctl
      # Runs even when the step above is killed by its timeout. Disk is the
      # leading suspect: every test clones a fresh database from the template
      # via CREATE DATABASE ... TEMPLATE, and a hosted runner has ~14 GB free.
      # If the janitor falls behind, PostgreSQL blocks on writes and the suite
      # stops dead with no error -- exactly the observed shape.
      - name: Resource snapshot
        if: always() && matrix.db == 'postgresql'
        run: |
          echo "=== disk ==="; df -h
          echo "=== memory ==="; free -m
          echo "=== postgres processes ==="; ps aux | grep -c '[p]ostgres' || true

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./js/app
    env:
      # WebKit's deps can't be cached and Firefox is not exercised by the suite.
      CI_PLAYWRIGHT_SKIP_WEBKIT: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache-dependency-path: ./js/pnpm-lock.yaml
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Get installed Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm list --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_ENV"
      - name: Cache Playwright binaries
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('js/app/playwright.config.ts') }}
      # Chromium only, matching the --project filter on the run step below.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Sync Python dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --extra container
      # Sandbox providers the suite needs. The Phoenix container image bundles
      # these; a bare runner does not, so pin the same versions and surface them
      # through the same env-var contract ensure_wasm_binary() / DenoAdapter use.
      - name: Install Deno (TypeScript sandbox provider)
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.1.4
      - name: Pre-download CPython WASM binary
        working-directory: ${{ github.workspace }}
        # URL/filename/sha256 MUST stay in sync with
        # src/phoenix/server/sandbox/_download.py.
        run: |
          mkdir -p .cache/wasm
          python -c "import hashlib, sys, urllib.request; \
          url = 'https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python%2F3.12.0%2B20231211-040d5a6/python-3.12.0.wasm'; \
          dest = '.cache/wasm/python-3.12.0.wasm'; \
          expected = 'e5dc5a398b07b54ea8fdb503bf68fb583d533f10ec3f930963e02b9505f7a763'; \
          urllib.request.urlretrieve(url, dest); \
          actual = hashlib.sha256(open(dest, 'rb').read()).hexdigest(); \
          (actual == expected) or sys.exit(f'SHA-256 mismatch for {dest}: expected {expected}, got {actual}')"
          echo "PHOENIX_WASM_BINARY_PATH=${{ github.workspace }}/.cache/wasm/python-3.12.0.wasm" >> "$GITHUB_ENV"
      # Chromium only. playwright.config.ts also defines a firefox project, but on a
      # standard hosted runner (2 Playwright workers) the two-browser suite produced
      # no result at all inside 60 minutes, where chromium alone finishes in ~11. The
      # earlier "passing" 14-minute run was an illusion: firefox was not installed, so
      # every firefox spec failed instantly on a missing binary and cost nothing.
      #
      # This is a deliberate narrowing of the gate, not a fix for whatever makes
      # firefox slow here. Chromium is the browser the fork's media UI is developed
      # against; revisit with `--project=firefox` on a schedule if that coverage is
      # wanted, rather than putting an hour back into every labelled PR.
      - name: Run Playwright tests
        run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: playwright-report
          path: js/app/playwright-report/
          retention-days: 30
